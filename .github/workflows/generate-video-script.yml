
name: Generate Cinematic Video Script

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Leave blank for an automatically selected topic"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate cinematic video blueprint
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VIDEO_TOPIC: ${{ inputs.topic }}
        run: |
          mkdir -p output

          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import sys

          key = os.environ.get("OPENROUTER_API_KEY")
          topic = os.environ.get("VIDEO_TOPIC", "").strip()

          if not key:
              sys.exit("ERROR: OPENROUTER_API_KEY is missing.")

          if topic:
              topic_instruction = f"Create a video about: {topic}"
          else:
              topic_instruction = """
              Invent a fresh, original, highly engaging cinematic video concept.
              Avoid generic facts-list videos.
              """

          prompt = f"""
          You are a professional cinematic documentary writer and visual director.

          {topic_instruction}

          Create a complete 5-7 minute cinematic video blueprint.

          QUALITY:
          - Premium cinematic documentary storytelling.
          - Photorealistic visual descriptions.
          - Detailed environments, lighting and atmosphere.
          - Smooth camera movements and varied compositions.
          - Strong suspense, pacing and narrative progression.
          - Natural, engaging narration.
          - No graphic violence or dangerous real-world instructions.

          FORMAT:

          # VIDEO TITLE
          # VIDEO DESCRIPTION
          # OPENING HOOK
          # COMPLETE NARRATION

          # SCENE BREAKDOWN

          Create 10-14 scenes.

          For every scene provide:
          1. Scene number and duration.
          2. Exact narration.
          3. Detailed cinematic visual prompt.
          4. Camera angle and movement.
          5. Lighting and atmosphere.
          6. Music and sound effects.
          7. Transition instructions.

          # THUMBNAIL CONCEPT
          # MUSIC DIRECTION
          # FINAL ENDING

          Make the story original, coherent and engaging.
          """

          payload = {
              "model": "openrouter/free",
              "messages": [
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],
              "max_tokens": 12000,
              "temperature": 0.8,
              "reasoning": {
                  "effort": "low",
                  "exclude": True
              }
          }

          request = urllib.request.Request(
              "https://openrouter.ai/api/v1/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {key}",
                  "Content-Type": "application/json",
                  "HTTP-Referer": "https://github.com",
                  "X-Title": "AutoYT"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=240) as response:
                  result = json.loads(response.read())

              choice = result["choices"][0]
              message = choice.get("message", {})
              content = message.get("content")

              print("Selected model:", result.get("model"))
              print("Finish reason:", choice.get("finish_reason"))
              print("Usage:", result.get("usage"))

              if isinstance(content, list):
                  content = "\n".join(
                      item.get("text", "")
                      for item in content
                      if isinstance(item, dict)
                  )

              if not isinstance(content, str) or not content.strip():
                  print("Response details:")
                  print(json.dumps(result, indent=2)[:5000])
                  sys.exit("ERROR: OpenRouter returned empty content.")

              os.makedirs("output", exist_ok=True)

              with open(
                  "output/video_blueprint.md",
                  "w",
                  encoding="utf-8"
              ) as file:
                  file.write(content)

              print("VIDEO BLUEPRINT GENERATED SUCCESSFULLY")
              print("Characters:", len(content))

          except urllib.error.HTTPError as error:
              print("API ERROR:", error.code)
              print(error.read().decode()[:3000])
              sys.exit(1)

          except Exception as error:
              print("ERROR:", repr(error))
              sys.exit(1)
          PY

      - name: Save generated blueprint
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-video-blueprint
          path: output/video_blueprint.md
          if-no-files-found: error
          retention-days: 7
