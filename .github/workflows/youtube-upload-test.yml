
name: YouTube Test Upload

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Create test video
        run: |
          ffmpeg -f lavfi -i color=c=blue:s=1280x720:d=10 \
          -vf "drawtext=text='AutoYT Test Upload':fontcolor=white:fontsize=48:x=(w-text_w)/2:y=(h-text_h)/2" \
          -c:v libx264 -pix_fmt yuv420p test-video.mp4

      - name: Upload to YouTube
        env:
          CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["CLIENT_ID"],
              client_secret=os.environ["CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube.upload"]
          )

          youtube = build("youtube", "v3", credentials=credentials)

          request = youtube.videos().insert(
              part="snippet,status",
              body={
                  "snippet": {
                      "title": "AutoYT Test Upload",
                      "description": "Testing automated YouTube upload.",
                      "categoryId": "22"
                  },
                  "status": {
                      "privacyStatus": "unlisted",
                      "selfDeclaredMadeForKids": False
                  }
              },
              media_body=MediaFileUpload(
                  "test-video.mp4",
                  mimetype="video/mp4",
                  resumable=True
              )
          )

          response = request.execute()
          print("UPLOAD SUCCESS!")
          print("Video ID:", response["id"])
          print("Video URL: https://www.youtube.com/watch?v=" + response["id"])
          PY
