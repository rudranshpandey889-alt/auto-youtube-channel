
      - name: Generate video script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p output
          python - <<'PY'
          import os, json, requests, time

          prompt = """
          Create an original, engaging YouTube documentary script.
          Return ONLY valid JSON:
          {
            "title": "video title",
            "scenes": [
              {
                "narration": "70 to 100 words",
                "visual": "visual description",
                "caption": "short caption"
              }
            ]
          }
          Create exactly 8 scenes.
          Choose an interesting science, history, nature,
          mystery or technology topic.
          Keep it factual, cinematic and original.
          No graphic violence.
          """

          headers = {
              "Authorization": "Bearer " + os.environ["OPENROUTER_API_KEY"],
              "Content-Type": "application/json",
              "HTTP-Referer": "https://github.com",
              "X-Title": "AutoYT"
          }

          data = None

          for attempt in range(5):
              print(f"Generation attempt {attempt + 1}/5")

              try:
                  response = requests.post(
                      "https://openrouter.ai/api/v1/chat/completions",
                      headers=headers,
                      json={
                          "model": "openrouter/free",
                          "messages": [
                              {"role": "user", "content": prompt}
                          ],
                          "temperature": 0.7,
                          "max_tokens": 7000,
                          "stream": False,
                          "reasoning": {
                              "effort": "low",
                              "exclude": True
                          }
                      },
                      timeout=180
                  )

                  response.raise_for_status()
                  result = response.json()

                  choices = result.get("choices") or []
                  if not choices:
                      raise ValueError("No choices returned: " +
                                       json.dumps(result)[:1000])

                  message = choices[0].get("message") or {}
                  content = message.get("content")

                  if isinstance(content, list):
                      content = "".join(
                          item.get("text", "")
                          for item in content
                          if isinstance(item, dict)
                      )

                  if not isinstance(content, str) or not content.strip():
                      raise ValueError(
                          "Model returned empty content. Finish reason: " +
                          str(choices[0].get("finish_reason"))
                      )

                  content = content.strip()

                  if content.startswith("```"):
                      content = content.split("\n", 1)[1]
                      content = content.rsplit("```", 1)[0].strip()

                  parsed = json.loads(content)

                  if not isinstance(parsed.get("scenes"), list):
                      raise ValueError("Missing scenes array")

                  if len(parsed["scenes"]) != 8:
                      raise ValueError("Expected exactly 8 scenes")

                  if not parsed.get("title"):
                      raise ValueError("Missing video title")

                  for scene in parsed["scenes"]:
                      for field in ("narration", "visual", "caption"):
                          if not isinstance(scene.get(field), str) or not scene[field].strip():
                              raise ValueError("Missing scene field: " + field)

                  data = parsed
                  break

              except Exception as error:
                  print("Attempt failed:", str(error)[:1000])
                  if attempt < 4:
                      time.sleep(10)

          if data is None:
              raise RuntimeError(
                  "Could not generate a valid script after 5 attempts."
              )

          with open("output/story.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print("SCRIPT GENERATED:", data["title"])
          PY
