
name: AutoYT - Generate Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pip
          python -m pip install requests pillow

      - name: Generate video script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p output

          python - <<'PY'
          import os
          import json
          import requests
          import time

          prompt = """
          Create an original YouTube documentary script.

          Return ONLY valid JSON in this format:
          {
            "title": "Video title",
            "scenes": [
              {
                "narration": "Narration text",
                "visual": "Visual description",
                "caption": "Short caption"
              }
            ]
          }

          Requirements:
          - Exactly 8 scenes.
          - Each narration should contain 70-100 words.
          - Choose an interesting science, history, nature,
            technology or mystery topic.
          - Make it factual, engaging and original.
          - No graphic violence.
          """

          api_key = os.environ.get("OPENROUTER_API_KEY")

          if not api_key:
              raise RuntimeError("OPENROUTER_API_KEY secret is missing.")

          headers = {
              "Authorization": "Bearer " + api_key,
              "Content-Type": "application/json",
              "HTTP-Referer": "https://github.com",
              "X-Title": "AutoYT"
          }

          story = None

          for attempt in range(5):
              print("Generation attempt:", attempt + 1)

              try:
                  response = requests.post(
                      "https://openrouter.ai/api/v1/chat/completions",
                      headers=headers,
                      json={
                          "model": "openrouter/free",
                          "messages": [
                              {
                                  "role": "user",
                                  "content": prompt
                              }
                          ],
                          "temperature": 0.7,
                          "max_tokens": 7000,
                          "stream": False,
                          "reasoning": {
                              "effort": "low",
                              "exclude": True
                          }
                      },
                      timeout=180
                  )

                  response.raise_for_status()
                  result = response.json()

                  choices = result.get("choices") or []

                  if not choices:
                      raise ValueError(
                          "No choices returned: " +
                          json.dumps(result)[:1000]
                      )

                  choice = choices[0]
                  message = choice.get("message") or {}
                  content = message.get("content")

                  if isinstance(content, list):
                      content = "".join(
                          item.get("text", "")
                          for item in content
                          if isinstance(item, dict)
                      )

                  if not isinstance(content, str) or not content.strip():
                      raise ValueError(
                          "Empty model response. Finish reason: " +
                          str(choice.get("finish_reason"))
                      )

                  content = content.strip()

                  if content.startswith("```"):
                      content = content.split("\n", 1)[1]
                      content = content.rsplit("```", 1)[0].strip()

                  parsed = json.loads(content)

                  if not isinstance(parsed.get("scenes"), list):
                      raise ValueError("Invalid scenes array.")

                  if len(parsed["scenes"]) != 8:
                      raise ValueError("Expected exactly 8 scenes.")

                  if not parsed.get("title"):
                      raise ValueError("Video title is missing.")

                  for scene in parsed["scenes"]:
                      for field in ("narration", "visual", "caption"):
                          value = scene.get(field)
                          if not isinstance(value, str) or not value.strip():
                              raise ValueError(
                                  "Missing field: " + field
                              )

                  story = parsed
                  break

              except Exception as error:
                  print("Attempt failed:", str(error)[:1000])
                  if attempt < 4:
                      time.sleep(10)

          if story is None:
              raise RuntimeError(
                  "Script generation failed after 5 attempts."
              )

          with open("output/story.json", "w", encoding="utf-8") as file:
              json.dump(story, file, ensure_ascii=False, indent=2)

          print("SCRIPT GENERATED:", story["title"])
          PY

      - name: Create narrated video
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import textwrap

          from PIL import Image, ImageDraw, ImageFont

          WIDTH = 1280
          HEIGHT = 720

          os.makedirs("output/scenes", exist_ok=True)

          with open("output/story.json", encoding="utf-8") as file:
              story = json.load(file)

          try:
              title_font = ImageFont.truetype(
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  52
              )
              caption_font = ImageFont.truetype(
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
                  32
              )
              small_font = ImageFont.truetype(
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
                  22
              )
          except OSError:
              title_font = ImageFont.load_default()
              caption_font = title_font
              small_font = title_font

          clips = []

          for index, scene in enumerate(story["scenes"]):
              print("Creating scene", index + 1)

              image = Image.new(
                  "RGB",
                  (WIDTH, HEIGHT),
                  (12, 20, 38)
              )

              draw = ImageDraw.Draw(image)

              for y in range(HEIGHT):
                  ratio = y / HEIGHT
                  color = (
                      int(8 + 15 * ratio),
                      int(18 + 25 * ratio),
                      int(35 + 35 * ratio)
                  )
                  draw.line((0, y, WIDTH, y), fill=color)

              draw.ellipse(
                  (820, -160, 1450, 470),
                  fill=(24, 52, 83)
              )

              draw.ellipse(
                  (-250, 430, 450, 1100),
                  fill=(19, 39, 66)
              )

              draw.rectangle(
                  (75, 70, 84, 650),
                  fill=(80, 190, 220)
              )

              title = story["title"]

              for line_number, line in enumerate(
                  textwrap.wrap(title, width=35)[:2]
              ):
                  draw.text(
                      (120, 100 + line_number * 65),
                      line,
                      font=title_font,
                      fill=(255, 255, 255)
                  )

              caption_lines = textwrap.wrap(
                  scene["caption"],
                  width=38
              )[:3]

              y_position = 310

              for line in caption_lines:
                  draw.text(
                      (120, y_position),
                      line,
                      font=caption_font,
                      fill=(180, 225, 245)
                  )
                  y_position += 48

              visual_lines = textwrap.wrap(
                  scene["visual"],
                  width=85
              )[:2]

              for line_number, line in enumerate(visual_lines):
                  draw.text(
                      (120, 590 + line_number * 30),
                      line,
                      font=small_font,
                      fill=(190, 200, 215)
                  )

              image_path = (
                  f"output/scenes/scene_{index:02}.png"
              )

              image.save(image_path)

              text_path = (
                  f"output/scenes/voice_{index:02}.txt"
              )

              audio_path = (
                  f"output/scenes/voice_{index:02}.wav"
              )

              with open(text_path, "w", encoding="utf-8") as file:
                  file.write(scene["narration"])

              subprocess.run(
                  [
                      "espeak-ng",
                      "-v", "en-us",
                      "-s", "145",
                      "-f", text_path,
                      "-w", audio_path
                  ],
                  check=True
              )

              duration_text = subprocess.check_output(
                  [
                      "ffprobe",
                      "-v", "error",
                      "-show_entries", "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      audio_path
                  ],
                  text=True
              ).strip()

              duration = float(duration_text) + 1.5
              frame_count = int(duration * 25)

              clip_path = (
                  f"output/scenes/clip_{index:02}.mp4"
              )

              subprocess.run(
                  [
                      "ffmpeg",
                      "-y",
                      "-loop", "1",
                      "-i", image_path,
                      "-i", audio_path,
                      "-vf",
                      (
                          "scale=1600:900,"
                          "zoompan=z='min(zoom+0.0005,1.12)':"
                          "x='iw/2-(iw/zoom/2)':"
                          "y='ih/2-(ih/zoom/2)':"
                          f"d={frame_count}:"
                          "s=1280x720:fps=25,"
                          "format=yuv420p"
                      ),
                      "-af", "apad",
                      "-t", str(duration),
                      "-c:v", "libx264",
                      "-preset", "ultrafast",
                      "-c:a", "aac",
                      "-b:a", "128k",
                      "-shortest",
                      clip_path
                  ],
                  check=True
              )

              clips.append(clip_path)

          concat_path = "output/concat.txt"

          with open(concat_path, "w", encoding="utf-8") as file:
              for clip in clips:
                  absolute_path = os.path.abspath(clip)
                  file.write(f"file '{absolute_path}'\n")

          subprocess.run(
              [
                  "ffmpeg",
                  "-y",
                  "-f", "concat",
                  "-safe", "0",
                  "-i", concat_path,
                  "-c", "copy",
                  "-movflags", "+faststart",
                  "output/final_video.mp4"
              ],
              check=True
          )

          with open(
              "output/video_title.txt",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(story["title"])

          print("VIDEO CREATED SUCCESSFULLY")
          PY

      - name: Upload generated video
        uses: actions/upload-artifact@v4
        with:
          name: auto-generated-video
          path: output/
          retention-days: 7
