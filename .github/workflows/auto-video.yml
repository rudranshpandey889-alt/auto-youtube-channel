name: AutoYT - Cinematic AI Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *" # 17:30 India time

permissions:
  contents: read

concurrency:
  group: autoyt-video
  cancel-in-progress: false

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install requests pillow edge-tts

      - name: Generate story, visuals, narration and video
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p output
          cat > build_video.py <<'PY'
          import os, json, time, base64, subprocess, math, wave, struct, re, sys
          from pathlib import Path
          import requests
          from PIL import Image

          OUT = Path("output")
          SCENES_DIR = OUT / "scenes"
          SCENES_DIR.mkdir(parents=True, exist_ok=True)
          OPENROUTER_KEY = os.environ["OPENROUTER_API_KEY"]
          CF_TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          CF_ACCOUNT = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          WIDTH, HEIGHT, FPS = 1280, 720, 25

          def run(cmd):
              subprocess.run(cmd, check=True)

          def duration(path):
              raw = subprocess.check_output([
                  "ffprobe", "-v", "error", "-show_entries", "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1", str(path)
              ], text=True).strip()
              return float(raw)

          def parse_json(text):
              text = text.strip()
              text = re.sub(r"^```(?:json)?\s*|\s*```$", "", text, flags=re.I)
              first, last = text.find("{"), text.rfind("}")
              if first < 0 or last <= first:
                  raise ValueError("Model response did not contain a JSON object")
              return json.loads(text[first:last + 1])

          prompt = r"""
          Create a premium, high-retention YouTube mini-documentary for a general English-speaking audience.
          Choose ONE highly clickable topic. Priority categories: GTA 6 and gaming news; NVIDIA, AI and technology; Elon Musk and business/innovation; billionaires, money and wealth explained; human behaviour and psychology; surprising brain facts; why time feels faster or life feels different after 2020; discipline, motivation, obsession and attention; how phones affect focus and habits.
          Prefer timely, widely discussed stories when reliable facts are available; otherwise choose a strong evergreen curiosity topic from these categories. Do NOT choose generic deep-ocean, animal, geography or school-fact topics unless unusually newsworthy. Make the story specific, factual, conversational and emotionally engaging. Never invent quotes, numbers, events or allegations.
          Avoid graphic violence, dangerous instructions, misinformation and copyrighted character likenesses.
          Return ONLY valid JSON with this exact structure:
          {
            "title": "curiosity-driven YouTube title, maximum 85 characters",
            "description": "2-3 sentence description",
            "tags": ["tag1", "tag2", "tag3"],
            "scenes": [
              {"narration":"spoken narration, 14 to 22 words", "visual":"detailed cinematic image prompt", "caption":"short phrase, maximum 6 words"}
            ]
          }
          Requirements:
          - Exactly 24 scenes, in a connected story with a strong opening hook.
          - Every scene must add a new visual idea or piece of information.
          - Use natural spoken English, contractions and varied sentence rhythms.
          - Do not repeat the same point in different words.
          - Each visual prompt must describe a distinct composition, camera angle, environment or subject.
          - Prompts must be suitable for a widescreen cinematic visual; no text, logos or watermarks.
          - Every scene must also include "stock_query": a concise 2-5 word search phrase describing real-world footage or imagery for that scene.
          - Prefer visual variety: people, real places, technology, city scenes, devices, workplaces, cinematic close-ups and illustrative metaphors.
          - End with a satisfying conclusion and a natural call to action.
          """

          headers = {
              "Authorization": "Bearer " + OPENROUTER_KEY,
              "Content-Type": "application/json",
              "HTTP-Referer": "https://github.com",
              "X-Title": "AutoYT"
          }

          story = None
          for attempt in range(1, 7):
              try:
                  print(f"Generating story: attempt {attempt}/6")
                  response = requests.post(
                      "https://openrouter.ai/api/v1/chat/completions",
                      headers=headers,
                      json={
                          "model": "openrouter/free",
                          "messages": [{"role": "user", "content": prompt}],
                          "temperature": 0.8,
                          "max_tokens": 9000,
                          "stream": False
                      }, timeout=180
                  )
                  response.raise_for_status()
                  choices = response.json().get("choices") or []
                  if not choices:
                      raise ValueError("OpenRouter returned no choices")
                  content = (choices[0].get("message") or {}).get("content")
                  if isinstance(content, list):
                      content = "".join(x.get("text", "") for x in content if isinstance(x, dict))
                  if not isinstance(content, str) or not content.strip():
                      raise ValueError("OpenRouter returned empty content")
                  candidate = parse_json(content)
                  scenes = candidate.get("scenes")
                  if not isinstance(scenes, list) or len(scenes) != 24:
                      raise ValueError(f"Expected 24 scenes; received {len(scenes) if isinstance(scenes, list) else 'invalid'}")
                  if not isinstance(candidate.get("title"), str) or not candidate["title"].strip():
                      raise ValueError("Missing video title")
                  for number, scene in enumerate(scenes, 1):
                      for key in ("narration", "visual", "caption"):
                          if not isinstance(scene.get(key), str) or not scene[key].strip():
                              raise ValueError(f"Scene {number} is missing {key}")
                  story = candidate
                  break
              except Exception as exc:
                  print("Story generation failed:", repr(exc))
                  if attempt == 6:
                      raise
                  time.sleep(7 * attempt)

          (OUT / "story.json").write_text(json.dumps(story, ensure_ascii=False, indent=2), encoding="utf-8")
          print("VIDEO TOPIC:", story["title"])

          COMMONS_ATTRIBUTIONS = []
          COMMONS_API = "https://commons.wikimedia.org/w/api.php"

          def clean_html(value):
              value = re.sub(r"<[^>]+>", " ", str(value or ""))
              return re.sub(r"\s+", " ", value).strip()

          def find_commons_media(query, index):
              """Try one Commons video search, then one image search; require reusable licences."""
              query = re.sub(r"[^a-zA-Z0-9 ]", " ", str(query or ""))
              query = " ".join(query.split()[:6])
              if len(query) < 3:
                  return None
              session = requests.Session()
              headers = {"User-Agent": "AutoYTVideoBot/1.0 (personal YouTube video project; contact via GitHub repository)"}
              for file_kind in ("video", "bitmap"):
                  try:
                      params = {
                          "action": "query", "format": "json", "generator": "search",
                          "gsrsearch": f"filetype:{file_kind} {query}",
                          "gsrnamespace": 6, "gsrlimit": 6,
                          "prop": "imageinfo", "iiprop": "url|extmetadata|mime"
                      }
                      response = session.get(COMMONS_API, params=params, headers=headers, timeout=35)
                      response.raise_for_status()
                      pages = (response.json().get("query") or {}).get("pages") or {}
                      for page in pages.values():
                          infos = page.get("imageinfo") or []
                          if not infos:
                              continue
                          info = infos[0]
                          mime = str(info.get("mime") or "")
                          is_video = mime.startswith("video/")
                          if file_kind == "video" and not is_video:
                              continue
                          if file_kind == "bitmap" and not mime.startswith("image/"):
                              continue
                          meta = info.get("extmetadata") or {}
                          license_name = clean_html((meta.get("LicenseShortName") or {}).get("value", ""))
                          license_lower = license_name.lower()
                          allowed = (
                              "cc0" in license_lower or "public domain" in license_lower
                              or (license_lower.startswith("cc by ") and "sa" not in license_lower)
                          )
                          if not allowed:
                              continue
                          media_url = info.get("url")
                          if not media_url:
                              continue
                          suffix = Path(media_url.split("?")[0]).suffix.lower()
                          if suffix not in {".mp4", ".webm", ".ogv", ".ogg", ".jpg", ".jpeg", ".png", ".gif"}:
                              continue
                          target = SCENES_DIR / f"commons_{index:02}{suffix}"
                          try:
                              with session.get(media_url, headers=headers, stream=True, timeout=90) as download:
                                  download.raise_for_status()
                                  total = 0
                                  with target.open("wb") as handle:
                                      for chunk in download.iter_content(chunk_size=1024 * 256):
                                          if not chunk:
                                              continue
                                          total += len(chunk)
                                          if total > 60 * 1024 * 1024:
                                              raise RuntimeError("Commons file exceeded 60 MB safety limit")
                                          handle.write(chunk)
                              if target.stat().st_size < 20_000:
                                  raise RuntimeError("Commons media file was too small")
                              if is_video:
                                  probe = subprocess.run(
                                      ["ffprobe", "-v", "error", "-select_streams", "v:0",
                                       "-show_entries", "stream=codec_type", "-of", "csv=p=0", str(target)],
                                      capture_output=True, text=True
                                  )
                                  if probe.returncode != 0 or "video" not in probe.stdout:
                                      raise RuntimeError("Downloaded Commons file is not a readable video")
                              else:
                                  image = Image.open(target).convert("RGB")
                                  scale = max(WIDTH / image.width, HEIGHT / image.height)
                                  image = image.resize((round(image.width * scale), round(image.height * scale)), Image.Resampling.LANCZOS)
                                  left, top = (image.width - WIDTH) // 2, (image.height - HEIGHT) // 2
                                  image = image.crop((left, top, left + WIDTH, top + HEIGHT))
                                  converted = SCENES_DIR / f"commons_{index:02}.jpg"
                                  image.save(converted, quality=92, optimize=True)
                                  target.unlink(missing_ok=True)
                                  target = converted
                              artist = clean_html((meta.get("Artist") or {}).get("value", "Unknown creator"))
                              source = info.get("descriptionurl") or page.get("canonicalurl") or media_url
                              COMMONS_ATTRIBUTIONS.append(
                                  f"{page.get('title', 'Wikimedia Commons file')} — {artist}; {license_name}; {source}"
                              )
                              print(f"Using Wikimedia Commons {'video' if is_video else 'image'} for scene {index}: {page.get('title')}")
                              time.sleep(1.2)
                              return {"type": "video" if is_video else "image", "path": target}
                          except Exception as exc:
                              target.unlink(missing_ok=True)
                              print("Skipping Commons candidate:", repr(exc))
                      time.sleep(1.2)
                  except Exception as exc:
                      print("Wikimedia Commons search failed:", repr(exc))
                      time.sleep(2)
              return None

          def generate_image(scene_prompt, index):
              endpoint = (
                  "https://api.cloudflare.com/client/v4/accounts/" + CF_ACCOUNT
                  + "/ai/run/@cf/black-forest-labs/flux-1-schnell"
              )
              full_prompt = (
                  "Wide 16:9 cinematic photorealistic documentary film still, professional film lighting, "
                  "strong composition, realistic materials, rich but natural colors, crisp subject separation. "
                  + scene_prompt + " No text, no letters, no subtitles, no logos, no watermark."
              )
              last_error = None
              for attempt in range(1, 4):
                  try:
                      print(f"AI image {index}/24, attempt {attempt}/3")
                      response = requests.post(
                          endpoint,
                          headers={"Authorization": "Bearer " + CF_TOKEN},
                          json={"prompt": full_prompt, "steps": 4},
                          timeout=240
                      )
                      if not response.ok:
                          raise RuntimeError(f"Cloudflare HTTP {response.status_code}: {response.text[:700]}")
                      payload = response.json()
                      encoded = (payload.get("result") or {}).get("image")
                      if not encoded:
                          raise RuntimeError("Cloudflare response has no result.image field")
                      raw = base64.b64decode(encoded)
                      temp = SCENES_DIR / f"raw_{index:02}.bin"
                      temp.write_bytes(raw)
                      image = Image.open(temp).convert("RGB")
                      scale = max(WIDTH / image.width, HEIGHT / image.height)
                      image = image.resize((round(image.width * scale), round(image.height * scale)), Image.Resampling.LANCZOS)
                      left = (image.width - WIDTH) // 2
                      top = (image.height - HEIGHT) // 2
                      image = image.crop((left, top, left + WIDTH, top + HEIGHT))
                      target = SCENES_DIR / f"scene_{index:02}.jpg"
                      image.save(target, quality=93, optimize=True)
                      temp.unlink(missing_ok=True)
                      return target
                  except Exception as exc:
                      last_error = exc
                      print("Image generation error:", repr(exc))
                      time.sleep(6 * attempt)
              raise RuntimeError(f"Could not generate image {index}: {last_error}")

          VOICES = [
              "en-US-AndrewNeural",
              "en-US-GuyNeural",
              "en-US-AriaNeural",
              "en-US-JennyNeural"
          ]

          def make_voice(text, output_path, scene_number):
              last_error = None
              for voice in VOICES:
                  for attempt in range(1, 4):
                      try:
                          output_path.unlink(missing_ok=True)
                          print(f"Voice scene {scene_number}: {voice}, attempt {attempt}/3")
                          run([
                              sys.executable, "-m", "edge_tts",
                              "--voice", voice,
                              "--rate=+3%",
                              "--pitch=-1Hz",
                              "--text", text,
                              "--write-media", str(output_path)
                          ])
                          if output_path.exists() and output_path.stat().st_size > 1500:
                              # Confirm the returned audio is readable before accepting it.
                              duration(output_path)
                              print("Voice created with", voice)
                              return
                          raise RuntimeError("TTS output file was missing or too small")
                      except Exception as exc:
                          last_error = exc
                          print("TTS attempt failed:", repr(exc))
                          time.sleep(5 * attempt)
              raise RuntimeError(
                  f"All Edge TTS voices failed for scene {scene_number}. Last error: {last_error}"
              )

          def srt_time(seconds):
              ms = int(round(seconds * 1000))
              hours, ms = divmod(ms, 3600000)
              minutes, ms = divmod(ms, 60000)
              secs, ms = divmod(ms, 1000)
              return f"{hours:02}:{minutes:02}:{secs:02},{ms:03}"

          subtitle_entries = []
          clip_paths = []
          timeline = 0.0

          for index, scene in enumerate(story["scenes"], 1):
              print(f"\n--- BUILDING SCENE {index}/24 ---")
              media = find_commons_media(scene.get("stock_query") or scene["visual"], index) if index % 2 == 0 else None
              if media is None:
                  media = {"type": "image", "path": generate_image(scene["visual"], index)}
              else:
                  print("Commons media selected:", media["type"], media["path"].name)
              voice_path = SCENES_DIR / f"voice_{index:02}.mp3"
              make_voice(scene["narration"], voice_path, index)
              voice_duration = duration(voice_path)
              clip_duration = voice_duration + 0.45

              # Break narration into short readable caption beats.
              words = scene["narration"].split()
              groups = [words[pos:pos + 6] for pos in range(0, len(words), 6)]
              for group_index, group in enumerate(groups):
                  start = timeline + voice_duration * group_index / len(groups)
                  end = timeline + voice_duration * (group_index + 1) / len(groups)
                  caption = " ".join(group).replace("--", "—")
                  subtitle_entries.append(
                      f"{len(subtitle_entries) + 1}\n{srt_time(start)} --> {srt_time(end)}\n{caption}\n"
                  )

              clip_path = SCENES_DIR / f"clip_{index:02}.mp4"
              fade_out = max(0.1, clip_duration - 0.30)
              if media["type"] == "video":
                  vf = (
                      f"scale={WIDTH}:{HEIGHT}:force_original_aspect_ratio=increase,"
                      f"crop={WIDTH}:{HEIGHT},fps={FPS},"
                      "fade=t=in:st=0:d=0.25,"
                      f"fade=t=out:st={fade_out:.3f}:d=0.30,format=yuv420p"
                  )
                  run([
                      "ffmpeg", "-y", "-stream_loop", "-1", "-i", str(media["path"]),
                      "-i", str(voice_path), "-map", "0:v:0", "-map", "1:a:0",
                      "-vf", vf, "-af", "apad", "-t", f"{clip_duration:.3f}",
                      "-c:v", "libx264", "-preset", "veryfast", "-crf", "22",
                      "-pix_fmt", "yuv420p", "-r", str(FPS),
                      "-c:a", "aac", "-b:a", "160k", "-shortest", str(clip_path)
                  ])
              else:
                  if index % 2:
                      x_expr = "iw/2-(iw/zoom/2)+8*sin(on/45)"
                  else:
                      x_expr = "iw/2-(iw/zoom/2)-8*sin(on/45)"
                  vf = (
                      "zoompan=z='min(zoom+0.00065,1.12)':"
                      f"x='{x_expr}':y='ih/2-(ih/zoom/2)':"
                      f"d=1:s={WIDTH}x{HEIGHT}:fps={FPS},"
                      "fade=t=in:st=0:d=0.25,"
                      f"fade=t=out:st={fade_out:.3f}:d=0.30,format=yuv420p"
                  )
                  run([
                      "ffmpeg", "-y", "-loop", "1", "-framerate", str(FPS),
                      "-i", str(media["path"]), "-i", str(voice_path),
                      "-vf", vf, "-af", "apad",
                      "-t", f"{clip_duration:.3f}",
                      "-c:v", "libx264", "-preset", "veryfast", "-crf", "22",
                      "-pix_fmt", "yuv420p", "-r", str(FPS),
                      "-c:a", "aac", "-b:a", "160k", "-shortest", str(clip_path)
                  ])
              clip_paths.append(clip_path)
              timeline += clip_duration

          (OUT / "subtitles.srt").write_text("\n".join(subtitle_entries), encoding="utf-8")
          concat_file = OUT / "concat.txt"
          concat_file.write_text(
              "".join("file '" + str(path.resolve()) + "'\n" for path in clip_paths),
              encoding="utf-8"
          )
          joined = OUT / "joined.mp4"
          run(["ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", str(concat_file), "-c", "copy", str(joined)])

          # Create a quiet original ambient music bed locally; no external music files.
          music_path = OUT / "ambient.wav"
          sample_rate = 22050
          total_samples = int(timeline * sample_rate)
          chords = [
              [130.81, 164.81, 196.00, 261.63],
              [110.00, 146.83, 174.61, 220.00],
              [87.31, 130.81, 164.81, 196.00],
              [98.00, 146.83, 196.00, 233.08]
          ]
          with wave.open(str(music_path), "wb") as wav:
              wav.setnchannels(2)
              wav.setsampwidth(2)
              wav.setframerate(sample_rate)
              for offset in range(0, total_samples, sample_rate):
                  count = min(sample_rate, total_samples - offset)
                  frames = bytearray()
                  for n in range(count):
                      t = (offset + n) / sample_rate
                      chord = chords[int(t // 12) % len(chords)]
                      envelope = min(1.0, t / 2.5, max(0.0, (timeline - t) / 3.0))
                      value = sum(math.sin(2 * math.pi * freq * t) * (0.0018 / (k + 1)) for k, freq in enumerate(chord))
                      sample = max(-32767, min(32767, int(value * envelope * 32767)))
                      frames.extend(struct.pack("<hh", sample, sample))
                  wav.writeframes(frames)

          final_path = OUT / "final_video.mp4"
          subtitle_filter = (
              "subtitles=output/subtitles.srt:"
              "force_style='FontName=DejaVu Sans,FontSize=21,"
              "PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,"
              "BorderStyle=1,Outline=2,Shadow=1,Alignment=2,MarginV=48'"
          )
          run([
              "ffmpeg", "-y", "-i", str(joined), "-i", str(music_path),
              "-vf", subtitle_filter,
              "-filter_complex",
              "[0:a]volume=1.0[voice];[1:a]volume=0.30[music];"
              "[voice][music]amix=inputs=2:duration=first:dropout_transition=2[a]",
              "-map", "0:v", "-map", "[a]",
              "-c:v", "libx264", "-preset", "veryfast", "-crf", "21",
              "-pix_fmt", "yuv420p", "-c:a", "aac", "-b:a", "192k",
              "-movflags", "+faststart", str(final_path)
          ])

          description = story.get("description") or "A cinematic story from AutoYT."
          tags = story.get("tags") or []
          metadata = {
              "title": story["title"][:100],
              "description": (description[:3800] + "\n\nCreated with AutoYT." + (("\n\nWikimedia Commons media credits:\n" + "\n".join(dict.fromkeys(COMMONS_ATTRIBUTIONS))) if COMMONS_ATTRIBUTIONS else ""))[:4900],
              "tags": [str(tag)[:30] for tag in tags[:15]],
              "categoryId": "28"
          }
          (OUT / "video_title.txt").write_text(metadata["title"], encoding="utf-8")
          (OUT / "youtube_metadata.json").write_text(json.dumps(metadata, ensure_ascii=False, indent=2), encoding="utf-8")
          print("VIDEO READY:", final_path, "duration:", round(duration(final_path), 1), "seconds")
          PY

          python build_video.py

      - name: Upload video to YouTube as private
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, requests
          from pathlib import Path

          required = ["YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN"]
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit("Missing GitHub Secrets: " + ", ".join(missing))

          token_response = requests.post(
              "https://oauth2.googleapis.com/token",
              data={
                  "client_id": os.environ["YOUTUBE_CLIENT_ID"],
                  "client_secret": os.environ["YOUTUBE_CLIENT_SECRET"],
                  "refresh_token": os.environ["YOUTUBE_REFRESH_TOKEN"],
                  "grant_type": "refresh_token"
              }, timeout=60
          )
          token_response.raise_for_status()
          access_token = token_response.json()["access_token"]
          metadata = json.loads(Path("output/youtube_metadata.json").read_text(encoding="utf-8"))
          video_path = Path("output/final_video.mp4")
          if not video_path.exists() or video_path.stat().st_size < 100000:
              raise RuntimeError("Final video is missing or unexpectedly small")

          headers = {
              "Authorization": "Bearer " + access_token,
              "Content-Type": "application/json; charset=UTF-8",
              "X-Upload-Content-Type": "video/mp4",
              "X-Upload-Content-Length": str(video_path.stat().st_size)
          }
          start = requests.post(
              "https://www.googleapis.com/upload/youtube/v3/videos?uploadType=resumable&part=snippet,status",
              headers=headers,
              json={
                  "snippet": {
                      "title": metadata["title"],
                      "description": metadata["description"],
                      "tags": metadata.get("tags", []),
                      "categoryId": metadata.get("categoryId", "28")
                  },
                  "status": {"privacyStatus": "private", "selfDeclaredMadeForKids": False}
              }, timeout=60
          )
          start.raise_for_status()
          upload_url = start.headers.get("Location")
          if not upload_url:
              raise RuntimeError("YouTube did not return a resumable upload URL")
          with video_path.open("rb") as handle:
              upload = requests.put(
                  upload_url, data=handle,
                  headers={"Content-Type": "video/mp4"}, timeout=1800
              )
          upload.raise_for_status()
          video_id = upload.json().get("id")
          print("UPLOAD COMPLETE. VIDEO ID:", video_id)
          print("PRIVATE VIDEO URL: https://www.youtube.com/watch?v=" + str(video_id))
          PY

      - name: Save generated video and assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoyt-video-and-assets
          path: output/
          retention-days: 7
